<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Advisory Bot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --bot-bubble: #1e2230;
    --user-bubble: #2a4a7a;
    --severe: #e5484d;
    --high: #f5a524;
    --medium: #f0c000;
    --low: #4caf82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user .bubble { background: var(--user-bubble); }
  .bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); }
  details {
    margin-top: 6px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    background: #12141a;
    max-width: 100%;
  }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .audit-row { margin: 6px 0; color: var(--muted); }
  .audit-row b { color: var(--text); }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #0f1115;
  }
  .badge.severe { background: var(--severe); color: white; }
  .badge.high { background: var(--high); }
  .badge.medium { background: var(--medium); }
  .badge.low { background: var(--low); }
  .candidate { margin: 3px 0 3px 14px; }
  #inputBar {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #inputBar form { display: flex; gap: 8px; max-width: 720px; width: 100%; margin: 0 auto; }
  #q {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0c0e12;
    color: var(--text);
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
  <header>
    <h1>Weather Advisory Bot</h1>
    <p>Answers grounded in live weather + written policies. Ask something like "Is it safe to cycle in Bhopal today?"</p>
  </header>

  <div id="chat"></div>

  <div id="inputBar">
    <form id="form">
      <input id="q" type="text" placeholder="Ask about outdoor activity safety..." autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </form>
  </div>

<script>
let sessionId = null;
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');

function addMessage(role, text, auditTrail) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);

  if (role === 'bot' && auditTrail) {
    wrap.appendChild(renderAudit(auditTrail));
  }

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function severityBadge(sev) {
  if (!sev) return '';
  return `<span class="badge ${sev}">${sev.toUpperCase()}</span>`;
}

function renderAudit(audit) {
  const details = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = 'Why this answer';
  details.appendChild(summary);

  const body = document.createElement('div');
  let html = '';

  if (audit.error) {
    html = `<div class="audit-row"><b>Failure path</b> — no policy was evaluated, because we never got data.</div>
            <div class="audit-row">Reason: ${escapeHtml(audit.reason || 'unknown')}</div>
            <div class="audit-row"><i>No forecast is reported when we don't have one.</i></div>`;
  } else if (!audit.top_3 || !audit.top_3.length) {
    html = `<div class="audit-row"><b>No policy matched.</b> ${escapeHtml(audit.reason || '')}</div>
            <div class="audit-row"><i>The honest "no guidance" answer is returned without calling the model at all, so no advice can be invented here.</i></div>`;
  } else {
    html += `<div class="audit-row"><b>Policies applied (ranked)</b></div>`;
    audit.top_3.forEach(s => {
      html += `<div class="candidate"><b>#${s.rank} ${escapeHtml(s.sop_id)}</b> — ${escapeHtml(s.name)} ${severityBadge(s.severity)} <span style="opacity:.7">spec ${s.specificity}</span>`;
      if (s.fuzzy_verdict) {
        html += ` <span style="opacity:.8">[fuzzy verdict: ${escapeHtml(s.fuzzy_verdict)}]</span>`;
      }
      const vals = Object.entries(s.values_used || {}).filter(([k]) => !k.startsWith('threshold_'));
      if (vals.length) {
        html += `<div style="margin-left:12px;opacity:.75">triggered by ${escapeHtml(vals.map(([k, v]) => `${k}=${v}`).join(', '))}</div>`;
      }
      html += `</div>`;
    });

    if (audit.other_candidates && audit.other_candidates.length) {
      html += `<div class="audit-row">Also matched, ranked below the top 3: ${escapeHtml(audit.other_candidates.join(', '))}</div>`;
    }
    if (audit.ranking_rule) {
      html += `<div class="audit-row"><i>${escapeHtml(audit.ranking_rule)}</i></div>`;
    }

    const g = audit.grounding || {};
    const ok = !(g.violations && g.violations.length);
    html += `<div class="audit-row" style="margin-top:8px;"><b>Grounding:</b> ${ok ? '<span style="color:#4caf82">all weather numbers traced</span>' : '<span style="color:#e5484d">violations: ' + escapeHtml(g.violations.join(', ')) + '</span>'}`;
    if (g.retries) html += ` · retried ${g.retries}×`;
    if (g.fell_back_to_template) html += ` · fell back to deterministic template`;
    html += `</div>`;

    if (g.claims && g.claims.length) {
      g.claims.forEach(c => {
        html += `<div class="candidate" style="opacity:.8">${c.value}${escapeHtml(c.unit)} ← ${escapeHtml(c.source || 'UNVERIFIED')}</div>`;
      });
    }

    if (audit.weather_used && audit.weather_used.current) {
      const cur = Object.entries(audit.weather_used.current)
        .filter(([, v]) => typeof v === 'number')
        .map(([k, v]) => `${k}=${v}`).join(', ');
      html += `<div class="audit-row" style="margin-top:6px;"><b>Live API values used:</b> ${escapeHtml(cur)}</div>`;
    }
    if (audit.resolved_location) {
      html += `<div class="audit-row">Location resolved to: ${escapeHtml(audit.resolved_location)} · activity: ${escapeHtml(audit.activity || 'unknown')}</div>`;
    }
  }

  body.innerHTML = html;
  details.appendChild(body);
  return details;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  input.value = '';
  sendBtn.disabled = true;

  const typing = document.createElement('div');
  typing.className = 'msg bot';
  typing.innerHTML = '<div class="typing">thinking...</div>';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await resp.json();
    sessionId = data.session_id;
    typing.remove();
    addMessage('bot', data.response, data.audit_trail);
  } catch (err) {
    typing.remove();
    addMessage('bot', 'Network error -- couldn\'t reach the server. Please try again.');
  }

  sendBtn.disabled = false;
  input.focus();
});
</script>
</body>
</html>
